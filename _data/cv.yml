    Projects:
      - name: In-House Vortex Methods Suite
        summary: 3D incompressible classical/regularized vortex particle method; 2D compressible vortex particle method with bulk viscosity; Fast Multipole Method; particle remeshing and redistribution; MPI-parallelized Lagrangian solver.

      - name: Rotorcraft Simulation and Trimming Tools
        summary: In-house trimming for single-rotor, coaxial, compound, and multirotor configurations; hybrid Lagrangian-Eulerian flow solver; simulations of hover, cruise, vortex ring state, and ground effect.

      - name: Fluid-Structure Interaction Solver
        summary: 2D FSI code for flutter studies of oscillating airfoils.

      - name: Hydrogen Fuel-Cell Aircraft Conceptual Design
        summary: Collaboration on the conceptual design of a hydrogen fuel-cell aircraft.

      - name: Quantum Computation for Hypersonic Flow
        summary: Collaboration on implementing quantum computation for numerical hypersonic flow problems.

